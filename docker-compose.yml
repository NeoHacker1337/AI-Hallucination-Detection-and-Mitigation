services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Uncomment for NVIDIA GPUs:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  app:
    build: .
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      HG_DATA_DIR: /app/data
      HG_DATABASE_URL: sqlite:////app/data/halluguard.db
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface

volumes:
  ollama:
  hf-cache:
